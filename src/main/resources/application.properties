spring.application.name=TodoList

# データベースのURL
spring.datasource.url=jdbc:postgresql://localhost:5432/todo_list_db?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B9&rewriteBatchedStatements=true


# データベースのドライバクラス名
spring.datasource.driver-class-name=org.postgresql.Driver

# データベースのユーザー名
spring.datasource.username=postgres

# データベースのパスワード
spring.datasource.password=password

